
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Quantity Measurement</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <!-- Left panel -->
    <div class="auth-left">
      <div class="auth-pattern"></div>
      
      <div class="auth-graphic-container">
        <div class="hero-circle">
          <div class="hero-icons">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <!-- Thermometer -->
              <g transform="translate(10, 5)">
                <rect x="10" y="5" width="10" height="30" rx="5" fill="#fbbc04" stroke="#333" stroke-width="1.5" />
                <circle cx="15" cy="40" r="7" fill="#fbbc04" stroke="#333" stroke-width="1.5" />
                <!-- Red liquid inside -->
                <rect x="13.5" y="15" width="3" height="20" fill="#ea4335" />
                <circle cx="15" cy="40" r="4" fill="#ea4335" />
                <!-- markings -->
                <line x1="20" y1="12" x2="25" y2="12" stroke="#333" stroke-width="1" />
                <line x1="20" y1="18" x2="25" y2="18" stroke="#333" stroke-width="1" />
                <line x1="20" y1="24" x2="25" y2="24" stroke="#333" stroke-width="1" />
              </g>

              <!-- Scale / Gauge -->
              <g transform="translate(55, 10)">
                <!-- Stand -->
                <path d="M10 25 L5 35 L25 35 L20 25 Z" fill="#fbbc04" stroke="#333" stroke-width="1.5" />
                <!-- Dial face -->
                <circle cx="15" cy="15" r="13" fill="#fff" stroke="#333" stroke-width="1.5" />
                <!-- Tick marks -->
                <line x1="15" y1="4" x2="15" y2="7" stroke="#333" stroke-width="1" />
                <line x1="26" y1="15" x2="23" y2="15" stroke="#333" stroke-width="1" />
                <line x1="4" y1="15" x2="7" y2="15" stroke="#333" stroke-width="1" />
                <line x1="7" y1="7" x2="9" y2="9" stroke="#333" stroke-width="1" />
                <line x1="23" y1="7" x2="21" y2="9" stroke="#333" stroke-width="1" />
                <!-- Needle -->
                <line x1="15" y1="15" x2="18" y2="8" stroke="#ea4335" stroke-width="1.5" stroke-linecap="round" />
                <circle cx="15" cy="15" r="2.5" fill="#333" />
                <!-- Top pan -->
                <path d="M5 2 L25 2 L23 4 L7 4 Z" fill="#333" />
                <line x1="15" y1="4" x2="15" y2="2" stroke="#333" stroke-width="1.5" />
              </g>

              <!-- Ruler -->
              <g transform="translate(10, 60)">
                <rect x="5" y="0" width="12" height="35" fill="#fbbc04" stroke="#333" stroke-width="1.5" />
                <!-- Scale lines -->
                <line x1="11" y1="5" x2="17" y2="5" stroke="#333" stroke-width="1.2" />
                <line x1="13" y1="8" x2="17" y2="8" stroke="#333" stroke-width="0.8" />
                <line x1="11" y1="11" x2="17" y2="11" stroke="#333" stroke-width="1.2" />
                <line x1="13" y1="14" x2="17" y2="14" stroke="#333" stroke-width="0.8" />
                <line x1="11" y1="17" x2="17" y2="17" stroke="#333" stroke-width="1.2" />
                <line x1="13" y1="20" x2="17" y2="20" stroke="#333" stroke-width="0.8" />
                <line x1="11" y1="23" x2="17" y2="23" stroke="#333" stroke-width="1.2" />
                <line x1="13" y1="26" x2="17" y2="26" stroke="#333" stroke-width="0.8" />
                <line x1="11" y1="29" x2="17" y2="29" stroke="#333" stroke-width="1.2" />
              </g>

              <!-- Flask -->
              <g transform="translate(55, 55)">
                <!-- Back liquid -->
                <path d="M6 22 L24 22 L27 30 L3 30 Z" fill="#fbbc04" />
                <!-- Flask shape -->
                <path d="M11 5 L19 5 L19 12 L28 32 L2 32 L11 12 Z" fill="rgba(255,255,255,0.8)" stroke="#333" stroke-width="1.5" stroke-linejoin="round" />
                <!-- Front liquid curve (approximate) -->
                <path d="M7 23 Q 15 25 23 23 L26 30 L4 30 Z" fill="#fbbc04" />
                <!-- Flange -->
                <line x1="10" y1="5" x2="20" y2="5" stroke="#333" stroke-width="2" />
                <line x1="10" y1="8" x2="20" y2="8" stroke="#333" stroke-width="1.5" />
                <!-- Warning/measure lines -->
                <line x1="7" y1="26" x2="12" y2="26" stroke="#333" stroke-width="1" />
                <line x1="5" y1="29" x2="9" y2="29" stroke="#333" stroke-width="1" />
              </g>
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Fixed the typo based on the prompt's request for issues: 'QUANITY' -> 'QUANTITY' -->
      <h2 class="auth-title">QUANTITY MEASUREMENT APP</h2>
    </div>

    <!-- Right panel -->
    <div class="auth-right">
      <div class="auth-tabs">
        <button class="auth-tab" id="tabLogin" onclick="switchTab('login')">LOGIN</button>
        <button class="auth-tab active" id="tabSignup" onclick="switchTab('signup')">SIGNUP</button>
      </div>
      
      <div class="auth-form-container">
        <!-- Signup Form -->
        <form id="signupForm" class="auth-form" novalidate>
          <div class="input-group" id="group-signupName">
            <label>Full Name</label>
            <input type="text" id="signupName" required>
            <span class="error-text" id="error-signupName"></span>
          </div>
          <div class="input-group" id="group-signupEmail">
            <label>Email Id</label>
            <input type="email" id="signupEmail" required>
            <span class="error-text" id="error-signupEmail"></span>
          </div>
          <div class="input-group password-group" id="group-signupPassword">
            <label>Password</label>
            <div class="password-input">
              <input type="password" id="signupPassword" required>
              <button type="button" class="eye-btn" onclick="togglePassword('signupPassword', this)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <span class="error-text" id="error-signupPassword"></span>
          </div>
          <div class="input-group" id="group-signupMobile">
            <label>Mobile Number</label>
            <input type="tel" id="signupMobile" required>
            <span class="error-text" id="error-signupMobile"></span>
          </div>
          <button type="submit" class="auth-btn">Signup</button>
          <div class="auth-footer">
            Already registered? <a href="#" onclick="switchTab('login')">Login</a>
          </div>
        </form>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form hidden" novalidate>
          <div class="input-group" id="group-loginEmail">
            <label>Email Id</label>
            <input type="email" id="loginEmail" required>
            <span class="error-text" id="error-loginEmail"></span>
          </div>
          <div class="input-group password-group" id="group-loginPassword">
            <label>Password</label>
            <div class="password-input">
              <input type="password" id="loginPassword" required>
              <button type="button" class="eye-btn" onclick="togglePassword('loginPassword', this)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <span class="error-text" id="error-loginPassword"></span>
          </div>
          <button type="submit" class="auth-btn">Login</button>
          <div class="auth-footer">
            Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up</a>
          </div>
        </form>
      </div>

    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
